<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#9fd8ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Word Farm">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Olivia's Word Farm</title>
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="loading"><div class="spinner"></div><p>Getting the farm ready…</p></div>

  <div id="farm" class="mode-ui" hidden>
    <button id="btnSettings" class="round corner-left" aria-label="Grown-up settings">⚙️</button>
    <div class="corner-right hud-stack">
      <div id="stars" class="pill-count"><span>⭐</span><span id="starCount">0</span></div>
      <div id="basket" class="pill-count basket"></div>
    </div>

    <div id="seeds" class="sheet" hidden>
      <div class="sheet-head">
        <span id="seedTitle" class="sheet-title">🌱 Find the seed!</span>
        <button id="btnSeedSay" class="round small" aria-label="Say it again">🔊</button>
        <button id="btnSeedClose" class="round small" aria-label="Close">✖️</button>
      </div>
      <div id="seedRow" class="seed-row"></div>
    </div>

  </div>

  <div id="settings" class="overlay settings" hidden>
    <div class="card menu-card">
      <h1><span>Olivia's</span> Word Farm</h1>
      <p class="sub">Grown-up settings</p>

      <section>
        <h3>Practice</h3>
        <div class="chips">
          <button class="chip" id="mWords" aria-pressed="true">🔤 Words</button>
          <button class="chip" id="mNumbers" aria-pressed="false">🔢 Numbers</button>
        </div>
      </section>

      <section>
        <h3 id="rangeTitle">Modules</h3>
        <div id="moduleChips" class="chips"></div>
        <div class="row-links"><button id="selAll" class="link">All</button><button id="selNone" class="link">None</button></div>
        <div class="chips type-row">
          <button class="chip" id="tIrregular" aria-pressed="true">❤️ Irregular</button>
          <button class="chip" id="tDecodable" aria-pressed="true">🔤 Decodable</button>
        </div>
        <p id="poolInfo" class="hint"></p>
      </section>

      <section>
        <h3>Choices each time</h3>
        <div id="choiceChips" class="chips"></div>
      </section>

      <section id="trickySection" hidden>
        <h3>Words to practice</h3>
        <div id="tricky" class="tricky"></div>
      </section>

      <p class="total">Total stars: ⭐ <span id="totalStars">0</span></p>
      <button id="btnSettingsDone" class="big">Back to the farm 🌱</button>
      <p id="offlineReady" class="hint" hidden>✓ Ready to play offline</p>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
